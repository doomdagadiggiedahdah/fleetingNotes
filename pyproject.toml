[project]
name = "fleeting-notes"
version = "0.1.0"
description = "Voice transcription system for fleeting notes"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["transcribe"]
